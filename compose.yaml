name: zabbix-monitoring
services:
  postgres:
    image: postgres:18-alpine
    container_name: zabbix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:?ZABBIX_DB_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - zabbix_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix -d zabbix"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 768m
    networks:
      - zabbix
  server:
    image: zabbix/zabbix-server-pgsql:ubuntu-8.0-latest
    container_name: zabbix-server
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: postgres
      DB_SERVER_PORT: "5432"
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:?ZABBIX_DB_PASSWORD is required}
      ZBX_STARTPOLLERS: "5"
      ZBX_CACHESIZE: 32M
      ZBX_HISTORYCACHESIZE: 16M
      ZBX_TRENDCACHESIZE: 8M
      ZBX_VALUECACHESIZE: 16M
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:10051:10051"
    mem_limit: 1g
    networks:
      - zabbix
  web:
    image: zabbix/zabbix-web-nginx-pgsql:ubuntu-8.0-latest
    container_name: zabbix-web
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: postgres
      DB_SERVER_PORT: "5432"
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:?ZABBIX_DB_PASSWORD is required}
      ZBX_SERVER_HOST: server
      ZBX_SERVER_PORT: "10051"
      ZBX_SERVER_NAME: "Nomeia AI - Monitoramento"
      PHP_TZ: America/Sao_Paulo
    depends_on:
      postgres:
        condition: service_healthy
      server:
        condition: service_started
    ports:
      - "${SERVER_LAN_IP:?}:8082:8080"
    mem_limit: 512m
    networks:
      - zabbix
  agent2:
    image: zabbix/zabbix-agent2:ubuntu-8.0-latest
    container_name: zabbix-agent2
    restart: unless-stopped
    init: true
    network_mode: host
    pid: host
    group_add:
      - ${DOCKER_SOCK_GID:?DOCKER_SOCK_GID is required}
    environment:
      ZBX_HOSTNAME: ${ZABBIX_AGENT_HOSTNAME:-servidor-local}
      ZBX_SERVER_HOST: 127.0.0.1
      ZBX_SERVER_PORT: "10051"
      ZBX_ACTIVE_ALLOW: "true"
      ZBX_PASSIVE_ALLOW: "true"
      ZBX_PASSIVESERVERS: 172.30.240.0/24
      ZBX_TIMEOUT: "10"
      ZBX_DEBUGLEVEL: "3"
    volumes:
      - /:/host:ro,rslave
      - /sys:/sys:ro
      - /dev:/dev:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./nomeia-postgresql.conf:/etc/zabbix/zabbix_agent2.d/plugins.d/nomeia-postgresql.conf:ro
      - ./nomeia-hml-postgresql.conf:/etc/zabbix/zabbix_agent2.d/plugins.d/nomeia-hml-postgresql.conf:ro
      - ./custom-queries:/usr/local/share/zabbix/custom-queries/postgresql:ro
    mem_limit: 512m
  app-presence:
    build: ./presence-monitor
    container_name: zabbix-app-presence
    restart: unless-stopped
    network_mode: "service:server"
    depends_on:
      server:
        condition: service_started
    env_file:
      - ./presence-monitor/presence.env
    environment:
      ZABBIX_SERVER: 127.0.0.1
      ZABBIX_PORT: "10051"
    mem_limit: 128m


  grafana:
    image: grafana/grafana:13.2.1
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: "http://${SERVER_LAN_IP:?}:3000/"
    ports:
      - "${SERVER_LAN_IP:?}:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    mem_limit: 512m
    networks:
      - zabbix

volumes:
  zabbix_db:
  grafana_data:
networks:
  zabbix:
    name: zabbix-monitoring
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.240.0/24
